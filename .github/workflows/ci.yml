name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Un seul run par branche : les push successifs annulent les runs obsolètes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # Backend — qualité statique, puis suites fonctionnelles (pytest)
  # ------------------------------------------------------------------ #
  backend:
    name: Backend — ruff & pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Analyse statique (ruff)
        run: ruff check app

      - name: Tests fonctionnels (pytest)
        # backend/tests/test_phase2_accounting.py rejoue en sous-processus les
        # suites autonomes (clôture d'exercice, amortissements, TVA, grand livre
        # auxiliaire, journal d'audit, achat de quincaillerie depuis le PoS).
        run: python -m pytest -q

      - name: Publier le rapport de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-output
          path: backend/*.db
          if-no-files-found: ignore

  # ------------------------------------------------------------------ #
  # Frontend — lint, types & tests unitaires (Jest)
  # ------------------------------------------------------------------ #
  frontend:
    name: Frontend — lint, types & jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint 9 — flat config)
        run: npm run lint

      - name: Vérification des types (tsc --noEmit)
        run: npm run type-check

      - name: Tests unitaires (Jest)
        run: npm test -- --ci

  # ------------------------------------------------------------------ #
  # Build de production — informatif
  # ------------------------------------------------------------------ #
  # Non bloquant : la génération statique n'a jamais pu être validée sur le
  # poste de développement Windows (`next build` échoue au spawn des workers).
  # Ce job sert à confirmer que le build passe bien sur Linux.
  frontend-build:
    name: Frontend — build (informatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build
