global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules"

scrape_configs:
  - job_name: "erp-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"

  - job_name: "erp-redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "erp-postgres"
    static_configs:
      - targets: ["db:9187"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["backend:9100"]
