worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_prox_min_responses 2.0;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml;

    # Taille max des requêtes (upload logo base64, pièces jointes) — le
    # défaut de 1 Mo est trop juste pour les logos encodés en data URL.
    client_max_body_size 10m;

    # Upstream — backend API
    upstream erp_backend {
        server backend:8000;
        keepalive 32;
    }

    # Upstream — frontend
    upstream erp_frontend {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # En-têtes de sécurité (S-5)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Activée automatiquement en HTTPS (ignorée par les navigateurs en HTTP) :
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Masquer la version de nginx
        server_tokens off;

        # Backend API
        location /api/ {
            proxy_pass http://erp_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
        }

        # WebSocket (temps réel)
        location /ws/ {
            proxy_pass http://erp_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Frontend
        location / {
            proxy_pass http://erp_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Static files (uploads)
        location /files/ {
            proxy_pass http://erp_backend;
        }

        # Health checks
        location /health {
            proxy_pass http://erp_backend;
            access_log off;
        }
    }

    # ===================================================================== #
    # HTTPS (S-5) — à activer au déploiement avec de vrais certificats.
    #
    # 1. Générer les certs (Let's Encrypt, depuis l'hôte) :
