[pytest]
# Les suites autonomes de la phase 2 comptable (backend/test_*.py) sont des
# scripts exécutables ; elles sont pilotées depuis tests/test_phase2_accounting.py
# en sous-processus. On restreint donc la collecte à tests/ pour éviter que
# pytest ne tente de collecter les scripts eux-mêmes.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    slow: suite de tests longue (plusieurs minutes)
