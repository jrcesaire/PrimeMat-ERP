# Alembic configuration for ERP Matériaux de Construction
# Uses async SQLAlchemy 2 with PostgreSQL

[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg://erp_user:erp_pass@localhost:5432/erp_db
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 12
version_path_sep = os.sep

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic, test

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[formatter_test]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt =
